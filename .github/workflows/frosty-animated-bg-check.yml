name: Verify Frosty original static winter background in mobile browser
on:
  push:
    paths:
      - 'FROSTY_v1_7_index.html'
      - '.github/workflows/frosty-animated-bg-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run localhost game
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/frosty-bg-http.log 2>&1 &
          sleep 1
      - name: Verify unanimated original background and test gameplay
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const errors=[],assets=[];
            page.on('pageerror',e=>errors.push(e.message));
            page.on('request',r=>assets.push(r.url()));
            await page.addInitScript(()=>{
              localStorage.setItem('frostyPlayerName','TestFrosty');
              localStorage.setItem('frostyPlayerToken','d'.repeat(48));
            });
            await page.goto('http://127.0.0.1:8765/FROSTY_v1_7_index.html?v=2.7-check',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>performance.getEntriesByType('resource').some(x=>x.name.includes('/winter_depth.jpg')),{timeout:20000});
            await page.waitForTimeout(900);
            assert(assets.some(x=>x.includes('/winter_depth.jpg')),'Original winter art did not load');
            assert(!assets.some(x=>x.includes('frosty_animated_winter')||x.includes('winter-motion/')),
              'Animated background assets were still requested');
            const img=await page.evaluate(async()=>{
              const i=new Image();i.src='assets/winter_depth.jpg?v=2.7';await i.decode();
              return [i.naturalWidth,i.naturalHeight];
            });
            assert(img[0]>800&&img[1]>1400,'Original portrait winter image is missing');
            await page.locator('#play').click();
            await page.waitForTimeout(580);
            assert(await page.locator('#hud').isVisible(),'The gameplay HUD is not visible');
            assert.equal(errors.length,0,'Javascript runtime errors: '+errors.join(', '));
            console.log('ORIGINAL STATIC BACKGROUND PASSED',JSON.stringify({dimensions:img,jsErrors:0,animatedAssetsLoaded:false}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
