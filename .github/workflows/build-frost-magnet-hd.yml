name: Build improved Frost Magnet animation
on:
  push:
    paths:
      - '.github/workflows/build-frost-magnet-hd.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Rebuild smooth transparent 12-frame magnet from source
        run: |
          python - <<'PY'
          from PIL import Image, ImageEnhance, ImageFilter
          import io, base64, math
          source=Image.open(io.BytesIO(base64.b64decode(open('assets/frost_magnet_first.gif.base64').read())))
          raw=[]
          for i in range(source.n_frames):
              source.seek(i)
              raw.append(source.convert('RGBA').copy())
          # Find the bright/red magnet region across all animation frames.
          boxes=[]
          for fr in raw:
              rgb=fr.convert('RGB')
              w,h=rgb.size
              coords=[]
              for yy in range(h):
                  for xx in range(w):
                      r,g,b=rgb.getpixel((xx,yy))
                      red=r>70 and r>g*1.28 and r>b*1.08
                      ice=max(r,g,b)>125 and (g>75 or b>75)
                      if red or ice:coords.append((xx,yy))
              if coords:
                  boxes.append((min(p[0] for p in coords),min(p[1] for p in coords),max(p[0] for p in coords)+1,max(p[1] for p in coords)+1))
          if boxes:
              left=min(b[0] for b in boxes);top=min(b[1] for b in boxes)
              right=max(b[2] for b in boxes);bottom=max(b[3] for b in boxes)
              pad=3
              crop=(max(0,left-pad),max(0,top-pad),min(raw[0].width,right+pad),min(raw[0].height,bottom+pad))
          else:crop=(0,0,raw[0].width,raw[0].height)
          frames=[]
          for i in range(12):
              pos=i*len(raw)/12
              a=int(pos)%len(raw)
              b=(a+1)%len(raw)
              fr=Image.blend(raw[a],raw[b],pos-int(pos)).crop(crop)
              fr.thumbnail((116,116),Image.Resampling.LANCZOS)
              frame=Image.new('RGBA',(128,128),(0,0,0,0))
              frame.alpha_composite(fr,((128-fr.width)//2,(128-fr.height)//2))
              pixels=frame.load()
              for yy in range(128):
                  for xx in range(128):
                      r,g,b,alpha=pixels[xx,yy]
                      # Suppress navy background using color, not only brightness.
                      red=max(0,r-max(g,b)*0.86)
                      cyan=max(0,min(g,b)-r*.72)
                      bright=max(0,max(r,g,b)-90)
                      strength=max(red*3.2,cyan*1.9,bright*1.65)
                      mask=max(0,min(255,int(strength)))
                      pixels[xx,yy]=(r,g,b,int(alpha*mask/255))
              frames.append(frame)
          sheet=Image.new('RGBA',(128*len(frames),128),(0,0,0,0))
          for i,fr in enumerate(frames):
              sheet.alpha_composite(fr,(i*128,0))
          sheet.save('assets/frost_magnet_hd_frames.png',optimize=True)
          print('Generated',len(frames),'frames,',sheet.size)
          PY
      - name: Commit HD sprite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/frost_magnet_hd_frames.png
          if ! git diff --cached --quiet; then
            git commit -m "Build 12-frame HD Frost Magnet animation"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
