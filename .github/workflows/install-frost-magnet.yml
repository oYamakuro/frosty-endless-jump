name: Install Frost Magnet animation
on:
  push:
    paths:
      - 'assets/frost_magnet_first.gif.base64'
      - '.github/workflows/install-frost-magnet.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode GIF and verify frames
        run: |
          base64 -d assets/frost_magnet_first.gif.base64 > assets/frost_magnet_first.gif
          python - <<'PY'
          from pathlib import Path
          b=Path('assets/frost_magnet_first.gif').read_bytes()
          assert b.startswith(b'GIF89a'), 'Invalid GIF'
          print('Magnet GIF:',len(b),'bytes')
          PY
      - name: Commit and push GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/frost_magnet_first.gif
          if ! git diff --cached --quiet; then
            git commit -m "Install animated Frost Magnet powerup GIF"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
