name: Restore Frosty's eyes and remove lower blue dots
on:
  push:
    paths:
      - '.github/workflows/create-frosty-faceless.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Precisely remove only the two turquoise dots below the eyes
        run: |
          python3 -m pip install -q Pillow numpy opencv-python-headless
          python3 - <<'PY'
          import numpy as np, cv2, io, base64
          from PIL import Image,ImageDraw
          original=Image.open('assets/frosty_front.png').convert('RGBA')
          rgb=np.asarray(original.convert('RGB'))
          h,w=rgb.shape[:2]
          mask=np.zeros((h,w),dtype=np.uint8)
          # These marks are the two bright blue pendant-shaped dots on the scarf.
          # The eyes above y=147 remain untouched.
          for x,y in [(66,166),(99,166)]:
              cv2.ellipse(mask,(x,y),(12,16),0,0,360,255,-1)
          restored=cv2.inpaint(rgb,mask,6,cv2.INPAINT_TELEA)
          output=Image.fromarray(restored,'RGB').convert('RGBA')
          output.putalpha(original.getchannel('A'))
          output.save('assets/frosty_front_clean.png',optimize=True)
          print('CLEANED', output.size, 'masked_pixels',int((mask>0).sum()))
          # Inspect at native size and enlarged around visor + scarf.
          preview=Image.new('RGB',(810,505),(13,29,51))
          full_a=original.copy();full_b=output.copy()
          full_a.thumbnail((195,370));full_b.thumbnail((195,370))
          preview.paste(full_a,(30+(195-full_a.width)//2,36),full_a)
          preview.paste(full_b,(260+(195-full_b.width)//2,36),full_b)
          facebox=(47,104,126,188)
          crop_a=original.crop(facebox).resize((160,168),Image.Resampling.NEAREST)
          crop_b=output.crop(facebox).resize((160,168),Image.Resampling.NEAREST)
          preview.paste(crop_a,(500,40),crop_a)
          preview.paste(crop_b,(500,250),crop_b)
          d=ImageDraw.Draw(preview)
          d.text((64,422),'ORIGINAL: eyes + 2 dots',fill='#dbfaff')
          d.text((300,422),'CLEAN: same eyes, no dots',fill='#dbfaff')
          d.text((680,105),'BEFORE',fill='#dbfaff')
          d.text((680,318),'AFTER',fill='#dbfaff')
          b=io.BytesIO();preview.save(b,format='WEBP',quality=76)
          print('EYE_RESTORE_PREVIEW_START')
          print(base64.b64encode(b.getvalue()).decode('ascii'))
          print('EYE_RESTORE_PREVIEW_END')
          PY
      - name: Commit corrected Frosty sprite
        run: |
          git config user.name "FROSTY Art"
          git config user.email "frosty-art[bot]@users.noreply.github.com"
          git add assets/frosty_front_clean.png
          if ! git diff --cached --quiet; then
            git commit -m "Restore Frosty's eyes and remove the two lower blue dots"
            git push
          fi
