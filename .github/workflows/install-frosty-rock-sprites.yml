name: Install approved Frosty moving-platform sprites
on:
  push:
    paths:
      - 'scripts/install_frosty_rock_sprites.py'
      - '.github/workflows/install-frosty-rock-sprites.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - run: python scripts/install_frosty_rock_sprites.py
      - name: Publish generated sprite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/frosty_rocks_integrated_thrusters_8frames.png
          git rm -f assets/rock_unified_sprite_prototype.png
          if ! git diff --cached --quiet; then
            git commit -m "Install approved matching horizontal and vertical 8-frame rock animations"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
