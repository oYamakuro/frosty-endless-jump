<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#07162d"><title>FROSTY v0.3 – Endless Ice Jump</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061329;color:#effcff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{width:100vw;height:100dvh;display:block}button{color:#fff;cursor:pointer;font:700 16px system-ui;border:1px solid #76dcff;border-radius:15px;background:linear-gradient(180deg,#17618b,#0c2b51);padding:13px 18px;box-shadow:inset 0 1px #a5f3ff88,0 4px 18px #0006}button:active{transform:scale(.96)}.hidden{display:none!important}#hud{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:16px;right:16px;display:flex;justify-content:space-between;align-items:start;pointer-events:none;text-shadow:0 2px 9px #000}#hud strong{font-size:26px}#hud small{display:block;font-size:12px;color:#aeeaff}#pause{pointer-events:auto;font-size:22px;padding:8px 13px}#controls{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 20px;pointer-events:none}.direction{display:flex;gap:12px}#controls button{pointer-events:auto;width:70px;height:67px;font-size:27px;border-radius:22px;background:#12436bbd;backdrop-filter:blur(8px);touch-action:none;user-select:none}#controls #jump{width:82px;height:82px;font-size:28px;border-radius:50%;background:linear-gradient(180deg,#27a5d8,#15508b)}.overlay{position:fixed;inset:0;background:#031126c9;display:flex;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(9px)}.panel{width:min(100%,410px);max-height:92dvh;overflow:auto;padding:25px 23px;background:linear-gradient(155deg,#17466bfa,#081b37fa);border:1px solid #71dfff;border-radius:25px;box-shadow:0 0 45px #27bfff35,0 22px 80px #0009;text-align:center}.panel h1{font-size:35px;letter-spacing:3px;margin:0;color:#e3faff;text-shadow:0 0 15px #4fcfff}.panel h2{margin:0 0 12px}.panel p{color:#c6e5f4;line-height:1.5}.panel button{width:100%;margin-top:10px}.panel .secondary{background:#0b294a}.choice{text-align:left;display:block;margin:8px 0;padding:11px;border:1px solid #3e7898;border-radius:13px;background:#092541}.choice input{accent-color:#6edbff;margin-right:9px}.group-title{text-align:left;font-weight:800;margin:17px 0 6px;color:#9ce8ff}.mini{font-size:12px!important;color:#a9cddd!important}.hero{height:155px;object-fit:contain;filter:drop-shadow(0 0 18px #38cfff);margin:5px auto}.logo{font-size:13px;letter-spacing:4px;color:#98eaff;font-weight:800}#calibrate{font-size:13px}#status{font-size:12px;color:#a7edff}
</style></head><body><canvas id="game"></canvas><div id="hud"><div><strong id="score">0 m</strong><small id="best">Rekord: 0 m</small></div><button id="pause" aria-label="Pause">Ⅱ</button></div><div id="controls" class="hidden"><div class="direction" id="directions"><button id="left" aria-label="Links">◀</button><button id="right" aria-label="Rechts">▶</button></div><button id="jump" class="hidden" aria-label="Springen">⇧</button></div>
<div class="overlay" id="menu"><div class="panel"><div class="logo">ENDLESS ICE JUMP</div><h1>❄ FROSTY</h1><img class="hero" src="assets/frosty_front.png" alt="Frosty"><p id="menuText">Springe immer höher durch eine magische Eiswelt!</p><button id="play">▶ SPIELEN</button><button class="secondary" id="openSettings">⚙ EINSTELLUNGEN</button><p class="mini">Eisplattformen · Sprung-Booster · Endloser Aufstieg</p></div></div>
<div class="overlay hidden" id="settings"><div class="panel"><h2>⚙ Einstellungen</h2><div class="group-title">Bewegung</div><label class="choice"><input type="radio" name="move" value="touch"> Bildschirmtasten ◀ ▶</label><label class="choice"><input type="radio" name="move" value="tilt"> Handy neigen</label><div class="group-title">Springen</div><label class="choice"><input type="radio" name="jumpmode" value="auto"> Automatisch bei jeder Landung</label><label class="choice"><input type="radio" name="jumpmode" value="manual"> Manuell mit Sprungtaste ⇧</label><button class="secondary" id="calibrate">📐 Neigung kalibrieren / Sensor erlauben</button><p id="status">Für die Neigungssteuerung das Handy gerade halten und kalibrieren.</p><button id="saveSettings">✓ SPEICHERN & ZURÜCK</button></div></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');const get=(k,f)=>{try{return localStorage.getItem(k)||f}catch{return f}},set=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};let moveMode=get('frostyMove','touch'),jumpMode=get('frostyJump','auto'),best=Number(get('frostyBest','0'))||0;let W=0,H=0,dpr=1,platforms=[],flakes=[],particles=[],camera=0,highest=0,nextY=0,lastX=0,score=0,playing=false,paused=false,last=0,tilt=0,tiltBase=0,tiltReady=false,orientation=0,settingsWasPlaying=false;let input={left:false,right:false,jump:false},jumpQueued=false;const player={x:0,y:0,vx:0,vy:0,w:43,h:55,grounded:false,glow:0};const images={};for(const name of ['front','back']){const im=new Image();im.src='assets/frosty_'+name+'.png';images[name]=im}const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(x,a,b)=>Math.max(a,Math.min(b,x));function resize(){const oldW=W;W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);flakes=Array.from({length:75},()=>({x:rnd(0,W),y:rnd(0,H),r:rnd(.6,2.5),s:rnd(10,35),par:rnd(.08,.4)}));if(!playing&&!paused){player.x=W/2;player.y=H*.7}else if(oldW)player.x*=W/oldW}addEventListener('resize',resize);resize();function platform(x,y,w,boost=false){return{x,y,w,h:13,boost,shine:rnd(0,6.3)}}function addPlatform(){const gap=rnd(73,100),w=rnd(77,Math.min(120,W*.34));nextY-=gap;lastX=clamp(lastX+rnd(-100,100),10,W-w-10);platforms.push(platform(lastX,nextY,w,Math.random()<.14))}function reset(){input.left=input.right=input.jump=false;jumpQueued=false;camera=0;score=0;player.x=W/2;player.y=H*.69;player.vx=0;player.vy=-630;player.grounded=false;player.glow=0;particles=[];platforms=[platform(W/2-59,H*.79,118)];lastX=W/2-59;nextY=H*.79;while(nextY>-H)addPlatform();highest=player.y;playing=true;paused=false;$('menu').classList.add('hidden');$('settings').classList.add('hidden');updateUI()}function updateUI(){$('controls').classList.toggle('hidden',!playing||paused);$('directions').classList.toggle('hidden',moveMode==='tilt');$('jump').classList.toggle('hidden',jumpMode==='auto');$('hud').style.display=playing?'flex':'none'}function burst(x,y,n=13){for(let i=0;i<n;i++)particles.push({x,y,vx:rnd(-145,145),vy:rnd(-170,-20),life:rnd(.25,.7),size:rnd(2,5)})}function bounce(boost){player.vy=boost?-990:-655;player.grounded=false;player.glow=boost?1:.55;burst(player.x,player.y+player.h*.42,boost?25:12)}function update(dt){if(!playing||paused)return;let dir=(input.right?1:0)-(input.left?1:0);if(moveMode==='tilt'){const diff=orientation-tiltBase;dir=tiltReady?(Math.abs(diff)<5?0:clamp((diff-Math.sign(diff)*5)/20,-1,1)):0}const target=dir*245;player.vx+=(target-player.vx)*(1-Math.exp(-(dir?7:3.8)*dt));if(!dir&&Math.abs(player.vx)<3)player.vx=0;player.x+=player.vx*dt;if(player.x<-player.w*.5)player.x=W+player.w*.5;if(player.x>W+player.w*.5)player.x=-player.w*.5;const feet=player.y+player.h*.46;if(player.grounded){if(jumpMode==='auto'||jumpQueued){jumpQueued=false;bounce(false)}else{let standing=platforms.some(p=>Math.abs(feet-p.y)<5&&player.x+16>p.x&&player.x-16<p.x+p.w);if(!standing){player.grounded=false;player.vy=0}}}if(!player.grounded){player.vy+=1580*dt;player.y+=player.vy*dt;if(player.vy>0){for(const p of platforms){if(feet<=p.y+5&&player.y+player.h*.46>=p.y&&player.x+16>p.x&&player.x-16<p.x+p.w){player.y=p.y-player.h*.46;player.vy=0;player.grounded=true;burst(player.x,p.y,9);if(p.boost)bounce(true);else if(jumpMode==='auto')bounce(false);break}}}}if(player.y-camera<H*.39)camera=player.y-H*.39;highest=Math.min(highest,player.y);score=Math.max(score,Math.floor((H*.69-highest)/10));$('score').textContent=score+' m';if(score>best){best=score;set('frostyBest',best)}$('best').textContent='Rekord: '+best+' m';while(nextY>camera-230)addPlatform();platforms=platforms.filter(p=>p.y-camera<H+130);player.glow=Math.max(0,player.glow-dt*1.6);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=360*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);if(player.y-camera>H+100){playing=false;paused=false;input.left=input.right=false;$('menuText').textContent='Geschafft: '+score+' m · Rekord: '+best+' m';$('play').textContent='↻ NOCHMAL SPIELEN';$('menu').classList.remove('hidden');updateUI()}}
function polygon(pts,fill,stroke){ctx.beginPath();ctx.moveTo(...pts[0]);for(let i=1;i<pts.length;i++)ctx.lineTo(...pts[i]);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke()}}function bg(t){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#041027');g.addColorStop(.52,'#12395b');g.addColorStop(1,'#245a81');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.save();ctx.globalAlpha=.17;ctx.fillStyle='#4bf9d5';ctx.beginPath();ctx.ellipse(W*.3,H*.16,W*.65,H*.09,-.2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#a35cff';ctx.beginPath();ctx.ellipse(W*.85,H*.27,W*.48,H*.055,.2,0,Math.PI*2);ctx.fill();ctx.restore();ctx.fillStyle='#e5faff';for(const f of flakes){let y=((f.y+camera*f.par+t*f.s/1000)%H+H)%H;ctx.globalAlpha=.2+f.r/5;ctx.beginPath();ctx.arc(f.x,y,f.r,0,7);ctx.fill()}ctx.globalAlpha=1;ctx.fillStyle='#a2c6dd18';for(let i=0;i<8;i++){const x=i*W/7-20;polygon([[x,H],[x+W*.12,H*.78+(i%3)*19],[x+W*.25,H]],'#c4e9ff0d')}}function drawPlatform(p,t){const {x,y,w}=p;ctx.save();ctx.shadowColor=p.boost?'#40f9ff':'#54caff';ctx.shadowBlur=p.boost?21:11;polygon([[x+4,y+4],[x+w-4,y+4],[x+w-12,y+17],[x+12,y+17]],'#328cbd','#b3f8ff');ctx.shadowBlur=0;const g=ctx.createLinearGradient(0,y,0,y+14);g.addColorStop(0,'#e7ffff');g.addColorStop(.4,'#85d9f7');g.addColorStop(1,'#2575ac');ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x,y,w,13,5);ctx.fill();ctx.strokeStyle='#efffff';ctx.lineWidth=2;ctx.stroke();for(let i=13;i<w-8;i+=17){const len=12+((i*7)%18);polygon([[x+i,y+13],[x+i+12,y+13],[x+i+5,y+13+len]],'#67c8e8','#b0f3ff')}if(p.boost){ctx.shadowColor='#1defff';ctx.shadowBlur=13;ctx.strokeStyle='#ecffff';ctx.lineWidth=4;for(let k=0;k<2;k++){let cy=y+5-k*5;ctx.beginPath();ctx.moveTo(x+w/2-13,cy+3);ctx.lineTo(x+w/2,cy-3);ctx.lineTo(x+w/2+13,cy+3);ctx.stroke()}}ctx.restore()}function drawPlayer(t){const ascending=player.vy< -40&&!player.grounded;const im=images[ascending?'back':'front'];ctx.save();ctx.translate(player.x,player.y);ctx.rotate(clamp(player.vx/1700,-.16,.16));ctx.shadowColor='#4de9ff';ctx.shadowBlur=player.glow*25;if(im.complete&&im.naturalWidth){ctx.drawImage(im,-37,-52,74,94)}else{ctx.fillStyle='#b9f5ff';ctx.beginPath();ctx.ellipse(0,0,24,28,0,0,7);ctx.fill()}ctx.restore()}function draw(t){bg(t);ctx.save();ctx.translate(0,-camera);for(const p of platforms){if(p.y-camera>-50&&p.y-camera<H+60)drawPlatform(p,t)}for(const p of particles){ctx.globalAlpha=clamp(p.life*2,0,1);ctx.fillStyle='#d9ffff';ctx.fillRect(p.x,p.y,p.size,p.size)}ctx.globalAlpha=1;drawPlayer(t);ctx.restore()}function frame(t){let dt=Math.min((t-last)/1000,.035);last=t;update(dt);draw(t);requestAnimationFrame(frame)}requestAnimationFrame(frame);
function openSettings(){settingsWasPlaying=playing&&!paused;if(settingsWasPlaying)paused=true;input.left=input.right=false;document.querySelector('input[name=move][value="'+moveMode+'"]').checked=true;document.querySelector('input[name=jumpmode][value="'+jumpMode+'"]').checked=true;$('settings').classList.remove('hidden');updateUI()}function closeSettings(){moveMode=document.querySelector('input[name=move]:checked').value;jumpMode=document.querySelector('input[name=jumpmode]:checked').value;set('frostyMove',moveMode);set('frostyJump',jumpMode);$('settings').classList.add('hidden');if(settingsWasPlaying){paused=false;settingsWasPlaying=false}updateUI()}$('play').addEventListener('click',reset);$('openSettings').addEventListener('click',openSettings);$('pause').addEventListener('click',()=>{if(playing){paused=true;$('menuText').textContent='Spiel pausiert';$('play').textContent='↻ NEU STARTEN';$('menu').classList.remove('hidden');playing=false;updateUI()}});$('saveSettings').addEventListener('click',closeSettings);$('calibrate').addEventListener('click',async()=>{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){try{const result=await DeviceOrientationEvent.requestPermission();if(result!=='granted'){$('status').textContent='Sensor nicht erlaubt. Bitte Bildschirmtasten verwenden.';return}}catch(e){$('status').textContent='Sensorfreigabe fehlgeschlagen.';return}}tiltBase=orientation;tiltReady=true;$('status').textContent='✓ Kalibriert! Halte das Handy wie gewohnt.'});function bind(id,key){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch{}if(key==='jump'){jumpQueued=true}else input[key]=true});for(const type of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(type,()=>{if(key!=='jump')input[key]=false})}bind('left','left');bind('right','right');bind('jump','jump');addEventListener('keydown',e=>{if(['ArrowLeft','a','ArrowRight','d',' ','ArrowUp'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a')input.left=true;if(e.key==='ArrowRight'||e.key==='d')input.right=true;if(e.key===' '||e.key==='ArrowUp')jumpQueued=true});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')input.left=false;if(e.key==='ArrowRight'||e.key==='d')input.right=false});function clearInput(){input.left=input.right=input.jump=false;jumpQueued=false}addEventListener('blur',clearInput);document.addEventListener('visibilitychange',()=>{if(document.hidden)clearInput()});addEventListener('deviceorientation',e=>{if(e.gamma!==null){orientation=e.gamma;if(!tiltReady){tiltBase=orientation;tiltReady=true}}});$('best').textContent='Rekord: '+best+' m';updateUI();})();
</script></body></html>
