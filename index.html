<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#07182f"><title>FROSTY · Endless Ice Jump v0.8</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061329;color:white;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100dvh}#ui{position:fixed;inset:0;pointer-events:none}.panel{pointer-events:auto;position:absolute;inset:0;background:radial-gradient(ellipse at 50% 15%,#1d668bdb,#07162bf0 65%),linear-gradient(165deg,#07162bee,#102b51e8);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;padding:20px;text-align:center}.hidden{display:none!important}h1{font-size:clamp(38px,10vw,66px);margin:0;color:#dcfaff;text-shadow:0 0 22px #42d7ff}h2{margin:0}p{margin:0;color:#c9e6f6}.choice{display:flex;gap:12px;width:min(94vw,420px)}.hero{flex:1;border:2px solid #376787;border-radius:18px;padding:12px 4px;background:#0a2445;color:white;font-weight:700;font-size:17px;cursor:pointer}.hero img{height:145px;max-width:88%;object-fit:contain;display:block;margin:auto}.hero.active{border-color:#6cecff;box-shadow:0 0 18px #19c7fa77}button{font:inherit;cursor:pointer} .btn{border:1px solid #7bdfff;background:linear-gradient(#1878a7,#0b345e);color:white;padding:12px 25px;border-radius:16px;min-width:185px;font-weight:800;box-shadow:0 0 15px #18b8e477}.setting{display:flex;align-items:center;justify-content:space-between;width:min(90vw,390px);padding:12px;border-bottom:1px solid #47738b}select{background:#113a61;color:white;border:1px solid #7bdfff;border-radius:9px;padding:9px}#hud{position:absolute;top:env(safe-area-inset-top,12px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;font-weight:800;text-shadow:0 2px 8px #000;font-size:17px}#pause{pointer-events:auto;border:1px solid #8eeaff;background:#103657cc;border-radius:12px;color:white;font-size:22px;padding:9px 14px}#controls{position:absolute;bottom:max(30px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}.control{pointer-events:auto;border:2px solid #84e8ff;background:#10436b99;color:white;width:75px;height:75px;border-radius:50%;font-size:35px;font-weight:900;user-select:none;touch-action:none}.control:active{background:#1d8fb0}#rightgroup{display:flex;gap:10px}#jump{font-size:23px}small{color:#a7d6ec}</style></head><body><canvas id="game"></canvas><div id="ui"><div id="hud" class="hidden"><span id="height">❄ 0 m</span><span id="coins">🪙 0</span><button id="pause">Ⅱ</button></div><div id="controls" class="hidden"><div style="display:flex;gap:12px"><button class="control" id="left">❮</button><button class="control" id="right">❯</button></div><div id="rightgroup"><button class="control" id="jump">⇧</button></div></div><div id="menu" class="panel"><h1>FROSTY</h1><p>ENDLESS ICE JUMP · v0.8 · CHARAKTER-EDITION</p><h2>Wähle deinen Charakter</h2><div class="choice"><button class="hero active" data-char="frosty"><img src="assets/frosty_front.png?v=08">❄ FROSTY</button><button class="hero" data-char="lunar"><img src="assets/lunar_front.png?v=08">✦ LUNAR</button></div><button class="btn" id="play">▶ SPIELEN</button><button class="btn" id="settingsBtn">⚙ EINSTELLUNGEN</button><small>Goldmünzen · Eis-Booster · endloser Aufstieg</small><small>❄ Frosty & Lunar · Sprunganimationen links/rechts</small></div><div id="settings" class="panel hidden"><h2>⚙ Einstellungen</h2><div class="setting">Steuerung <select id="steer"><option value="touch">Touch</option><option value="tilt">Neigen</option></select></div><div class="setting">Springen <select id="mode"><option value="auto">Automatisch</option><option value="manual">Manuell</option></select></div><button class="btn" id="calibrate">Neigung kalibrieren</button><button class="btn" id="back">Zurück</button><small>Neigung auf iPhone ggf. erlauben</small></div><div id="paused" class="panel hidden"><h2>❄ Pause</h2><button class="btn" id="resume">Weiter</button><button class="btn" id="restart">Neustart</button><button class="btn" id="toMenu">Hauptmenü</button></div><div id="over" class="panel hidden"><h1>GAME OVER</h1><p id="result"></p><button class="btn" id="again">Nochmal spielen</button><button class="btn" id="home">Charakter wählen</button></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),cv=$('game'),ctx=cv.getContext('2d');let W=390,H=800,dpr=1,scene='menu',chosen='frosty',score=0,collected=0,best=0,camera=0,highest=0,platforms=[],tokens=[],particles=[],snow=[],last=0,tilt=0,tiltZero=0,keys={left:false,right:false},jumpPressed=false;const images={};for(const n of ['frosty_front','frosty_back','frosty_side','frosty_jump','lunar_front','lunar_back','lunar_side','lunar_run','lunar_jump','lunar_double','lunar_land']){const im=new Image;im.src='assets/'+n+'.png?v=08';images[n]=im}try{best=Number(localStorage.getItem('frostyBest')||0)}catch(e){}let p={x:195,y:0,vx:0,vy:0,w:49,h:67,onGround:false,glow:0,face:'front',anim:0};function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);snow=Array.from({length:65},()=>({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*2.1,s:0.4+Math.random()*1.2}))}addEventListener('resize',resize);resize();function show(name){for(const n of ['menu','settings','paused','over'])$(n).classList.toggle('hidden',name!==n);$('hud').classList.toggle('hidden',name==='menu'||name==='settings');$('controls').classList.toggle('hidden',name!=='game');scene=name}document.querySelectorAll('[data-char]').forEach(b=>b.onclick=()=>{chosen=b.dataset.char;document.querySelectorAll('[data-char]').forEach(x=>x.classList.toggle('active',x===b))});$('settingsBtn').onclick=()=>show('settings');$('back').onclick=()=>show('menu');$('play').onclick=()=>start();$('pause').onclick=()=>{resetInput();show('paused')};$('resume').onclick=()=>show('game');$('restart').onclick=()=>start();$('again').onclick=()=>start();$('home').onclick=()=>show('menu');$('toMenu').onclick=()=>show('menu');$('calibrate').onclick=async()=>{tiltZero=tilt;if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){try{await DeviceOrientationEvent.requestPermission()}catch(e){}}};addEventListener('deviceorientation',e=>{if(e.gamma!=null)tilt=e.gamma});function resetInput(){keys.left=keys.right=false;jumpPressed=false}addEventListener('blur',resetInput);document.addEventListener('visibilitychange',()=>{resetInput();if(document.hidden&&scene==='game')show('paused')});for(const [id,key] of [['left','left'],['right','right']]){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[key]=true});for(const ev of ['pointerup','pointercancel','pointerleave','lostpointercapture'])b.addEventListener(ev,()=>keys[key]=false)}$('jump').addEventListener('pointerdown',e=>{e.preventDefault();jumpPressed=true});for(const ev of ['pointerup','pointercancel','pointerleave','lostpointercapture'])$('jump').addEventListener(ev,()=>jumpPressed=false);addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(e.key===' '||e.key==='ArrowUp')jumpPressed=true});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false;if(e.key===' '||e.key==='ArrowUp')jumpPressed=false});function start(){resetInput();camera=0;highest=0;score=0;collected=0;platforms=[];tokens=[];particles=[];p={x:W/2,y:H-190,vx:0,vy:-11,w:Math.min(55,W*.14),h:Math.min(72,W*.19),onGround:false,glow:0,face:'back',anim:0};platforms.push({x:W/2-65,y:H-110,w:130,boost:false});let y=H-240;while(y>-400){addPlatform(y);y-=105+Math.random()*42}show('game')}function addPlatform(y){const w=95+Math.random()*45,x=12+Math.random()*Math.max(1,W-w-24),boost=Math.random()<.18;platforms.push({x,y,w,boost});if(Math.random()<.78)tokens.push({x:x+w/2,y:y-55,got:false,phase:Math.random()*6.28})}function burst(x,y,n=12){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*7,vy:-Math.random()*6,life:28+Math.random()*18})}function update(dt){if(scene!=='game')return;dt=Math.min(dt,2);let dir=(keys.right?1:0)-(keys.left?1:0);if($('steer').value==='tilt'){const g=tilt-tiltZero;dir=Math.abs(g)<5?0:Math.max(-1,Math.min(1,g/22))}p.anim+=dt;p.vx+=(dir*0.72-p.vx*.085)*dt;p.vx=Math.max(-6,Math.min(6,p.vx));p.x+=p.vx*dt;if(p.x<-p.w/2)p.x=W+p.w/2;if(p.x>W+p.w/2)p.x=-p.w/2;let prevBottom=p.y+p.h/2;p.vy+=.39*dt;p.y+=p.vy*dt;if(p.vy>=0){for(const pl of platforms){if(prevBottom<=pl.y+8&&p.y+p.h/2>=pl.y&&p.x+p.w*.3>pl.x&&p.x-p.w*.3<pl.x+pl.w){p.y=pl.y-p.h/2;p.vy=0;p.onGround=true;p.face='front';burst(p.x,pl.y,9);if($('mode').value==='auto'||jumpPressed){p.vy=pl.boost?-17.5:-12.7;p.onGround=false;p.face='back';p.glow=pl.boost?65:48;burst(p.x,pl.y,pl.boost?45:28)}break}}}if(p.onGround&&jumpPressed){p.vy=-12.7;p.onGround=false;p.face='back';p.glow=48;burst(p.x,p.y+p.h/2,26)}if(p.vy<-.5)p.face='back';else if(p.vy>1)p.face='front';p.glow=Math.max(0,p.glow-dt*.65);if(p.glow>8&&Math.random()<.85){particles.push({x:p.x+(Math.random()-.5)*p.w*.8,y:p.y-p.h*.65,vx:(Math.random()-.5)*2.7,vy:-1.5-Math.random()*3.8,life:22+Math.random()*25})}for(const t of tokens){if(!t.got&&Math.hypot(p.x-t.x,p.y-t.y)<p.w*.7+12){t.got=true;collected++;burst(t.x,t.y,12)}}for(const q of particles){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=.16*dt;q.life-=dt}particles=particles.filter(q=>q.life>0);const desired=Math.min(camera,p.y-H*.47);camera+=(desired-camera)*Math.min(1,.1*dt);highest=Math.max(highest,Math.max(0,(H-190-p.y)/10));score=Math.floor(highest);$('height').textContent='❄ '+score+' m';$('coins').textContent='🪙 '+collected;let top=Math.min(...platforms.map(x=>x.y));while(top>camera-230){top-=100+Math.random()*45;addPlatform(top)}platforms=platforms.filter(x=>x.y<camera+H+130);tokens=tokens.filter(x=>x.y<camera+H+130&&!x.got);if(p.y-camera>H+130){if(score>best){best=score;try{localStorage.setItem('frostyBest',best)}catch(e){}}$('result').textContent=`${score} m · ${collected} Münzen · Rekord ${best} m`;show('over')}}function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}function background(t){const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#05132d');grad.addColorStop(.5,'#103b67');grad.addColorStop(1,'#071a39');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);ctx.save();ctx.globalAlpha=.22;for(let i=0;i<5;i++){ctx.fillStyle=i%2?'#30dddf':'#9666ff';ctx.beginPath();let x=W*(i+.4)/5+Math.sin(t*.00035+i)*35;ctx.moveTo(x-80,0);ctx.lineTo(x+40,0);ctx.lineTo(x+105,H*.55);ctx.lineTo(x+5,H*.55);ctx.fill()}ctx.restore();ctx.save();ctx.globalAlpha=.42;let moonX=W*.76,moonY=H*.18;ctx.shadowBlur=30;ctx.shadowColor='#93d9ff';ctx.fillStyle='#a6d9f7';ctx.beginPath();ctx.arc(moonX,moonY,Math.min(W*.105,43),0,Math.PI*2);ctx.fill();ctx.restore();
ctx.fillStyle='#0b2847';ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W+45;x+=32)ctx.lineTo(x,H*.63+Math.sin(x*.026+1)*37+Math.cos(x*.041)*26);ctx.lineTo(W,H);ctx.fill();
ctx.fillStyle='#102d50';ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W+50;x+=45)ctx.lineTo(x,H*.78+Math.sin(x*.019)*45);ctx.lineTo(W,H);ctx.fill();for(const s of snow){s.y+=s.s*.55;if(s.y>H)s.y=0;ctx.fillStyle='#d4f8ffb0';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}}function drawPlatform(pl){let y=pl.y-camera;if(y<-80||y>H+70)return;ctx.save();ctx.shadowBlur=16;ctx.shadowColor=pl.boost?'#65ffff':'#2bafff';const g=ctx.createLinearGradient(0,y,0,y+25);g.addColorStop(0,'#f4ffff');g.addColorStop(.35,pl.boost?'#79fff1':'#79e9ff');g.addColorStop(1,'#1264b5');ctx.fillStyle=g;rounded(pl.x,y,pl.w,18,7);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#b8ffff';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#ffffff75';ctx.fillRect(pl.x+9,y+3,pl.w-18,2);ctx.fillStyle='#69c8efb8';for(let i=0;i<Math.floor(pl.w/23);i++){const px=pl.x+5+i*23;ctx.beginPath();ctx.moveTo(px,y+17);ctx.lineTo(px+17,y+17);ctx.lineTo(px+9,y+32+((i*11)%22));ctx.fill()}if(pl.boost){ctx.fillStyle='#e5ffff';ctx.font='bold 32px system-ui';ctx.textAlign='center';ctx.shadowBlur=14;ctx.shadowColor='#6affff';ctx.fillText('⇧',pl.x+pl.w/2,y+8)}ctx.restore()}function drawCoin(t,time){const y=t.y-camera;if(y<-40||y>H+40)return;const sx=Math.max(.23,Math.abs(Math.cos(time*.003+t.phase)));ctx.save();ctx.translate(t.x,y);ctx.scale(sx,1);ctx.shadowBlur=14;ctx.shadowColor='#ffc92e';ctx.fillStyle='#fbb52a';ctx.strokeStyle='#ffe88c';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(0,0,13,17,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#9d5b0b';ctx.font='bold 17px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('★',0,1);ctx.restore()}function drawPlayer(){const y=p.y-camera;if(p.glow>0){ctx.save();ctx.shadowBlur=30+p.glow*.7;ctx.shadowColor=chosen==='frosty'?'#42f3ff':'#67cfff';ctx.strokeStyle=`rgba(89,240,255,${p.glow/65})`;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(p.x,y-p.h*.48,p.w*.7,p.h*.5,0,0,Math.PI*2);ctx.stroke();ctx.restore()}let pose=p.face;
if(Math.abs(p.vx)>1.1 && p.onGround)pose=chosen==='lunar'?'run':'side';
else if(p.vy < -1.5 && Math.abs(p.vx)>0.9)pose=chosen==='lunar'?(p.glow>14?'double':'jump'):'jump';
else if(p.vy < -1.5)pose='back';
else if(Math.abs(p.vx)>2 && p.vy>1.5)pose='side';
const img=images[chosen+'_'+pose]||images[chosen+'_'+p.face];ctx.save();ctx.translate(p.x,y);if(p.vx<-.4 && ['side','run','jump','double'].includes(pose))ctx.scale(-1,1);
ctx.rotate(Math.max(-.25,Math.min(.25,p.vx*.043)));if(p.glow>5){ctx.shadowColor='#42eaff';ctx.shadowBlur=9+Math.min(24,p.glow*.38)}let w=p.w*1.15,h=p.h*1.38;if(pose==='jump'||pose==='double'){w*=1.08;h*=1.03;}if(img.complete&&img.naturalWidth)ctx.drawImage(img,-w/2,-h/2,w,h);else{ctx.fillStyle='#b8ecff';ctx.beginPath();ctx.arc(0,0,p.w/2,0,Math.PI*2);ctx.fill()}ctx.restore()}function render(t){background(t);if(scene==='game'||scene==='paused'||scene==='over'){for(const pl of platforms)drawPlatform(pl);for(const c of tokens)drawCoin(c,t);for(const q of particles){ctx.fillStyle=`rgba(128,243,255,${Math.min(1,q.life/20)})`;ctx.beginPath();ctx.shadowBlur=9;ctx.shadowColor='#6eefff';ctx.arc(q.x,q.y-camera,1.5+Math.max(0,q.life/18),0,Math.PI*2);ctx.fill()}ctx.shadowBlur=0;drawPlayer()}}function frame(t){const dt=last?(t-last)/16.666:1;last=t;update(dt);render(t);requestAnimationFrame(frame)}requestAnimationFrame(frame);})();
</script></body></html>
