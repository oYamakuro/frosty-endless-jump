*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06152e;color:white;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}.ui{position:fixed;inset:0;pointer-events:none}.hud{position:absolute;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;display:flex;gap:9px;align-items:center;justify-content:space-between}.pill,.round,.control,.action{background:linear-gradient(145deg,#183f6bcf,#07152fe8);border:1px solid #69dfff99;box-shadow:inset 0 0 13px #51d9ff44,0 0 15px #00cfff22;color:white;border-radius:18px;padding:10px 13px;font-weight:850;text-shadow:0 0 8px #39d8ff}.round{border-radius:16px;font-size:20px}.controls{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));left:15px;right:15px;display:flex;align-items:end;justify-content:space-between}.pair{display:flex;gap:12px}.control{width:68px;height:68px;border-radius:50%;font-size:32px;pointer-events:auto;user-select:none}.control:active{background:#1386b8}.jump{width:83px;height:83px;font-size:34px}.panel{pointer-events:auto;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(180deg,#06132999,#06132bbd)}.sheet{width:min(100%,390px);max-height:90dvh;overflow:auto;border:1px solid #6bdfff9c;border-radius:26px;padding:25px 21px;text-align:center;background:linear-gradient(160deg,#123d65f2,#09152df7);box-shadow:0 0 50px #00cfff35,inset 0 0 25px #5be3ff22}.logo{font-size:clamp(45px,12vw,66px);font-weight:1000;letter-spacing:2px;line-height:1.1;color:#e7faff;text-shadow:0 3px 0 #1687be,0 0 20px #56eaff}.subtitle{letter-spacing:3px;font-size:12px;font-weight:800;color:#b7ecff;margin:7px 0 22px}.action{display:block;width:100%;padding:15px;margin:11px 0;font-size:17px;cursor:pointer}.action.primary{background:linear-gradient(110deg,#0573b2,#1ec5e9);border-color:#c1ffff}.field{text-align:left;margin:15px 0;font-size:14px}.field label{display:block;margin-bottom:7px;color:#b9e9ff;font-weight:700}select{width:100%;padding:12px;border:1px solid #5bd7ff;border-radius:11px;background:#0d2d4d;color:white;font-size:16px}.small{font-size:12px;color:#a9c9df;line-height:1.5}.hidden{display:none!important}#toast{position:absolute;top:85px;left:50%;transform:translateX(-50%);font-weight:800;text-shadow:0 0 12px cyan}.frosty-preview{height:135px;object-fit:contain;filter:drop-shadow(0 0 16px #54caff);border-radius:18px}#pauseBtn{pointer-events:auto}.toptext{font-size:12px;color:#d4f7ff}
</style></head><body><canvas id="game"></canvas><div class="ui"><div class="hud"><div class="pill">❄ <span id="score">0</span> <span class="toptext">m</span></div><div class="pill">🪙 <span id="coins">0</span></div><button id="pauseBtn" class="round" aria-label="Pause">Ⅱ</button></div><div id="toast"></div><div id="controls" class="controls hidden"><div class="pair"><button id="left" class="control" aria-label="Links">❮</button><button id="right" class="control" aria-label="Rechts">❯</button></div><button id="jump" class="control jump" aria-label="Springen">⬆</button></div><section id="menu" class="panel"><div class="sheet"><div class="logo">FROSTY</div><div class="subtitle">ENDLESS ICE JUMP</div><img class="frosty-preview" src="assets/front.png" alt="Frosty"><p>Springe durch die eisige Nacht – immer höher!</p><button class="action primary" id="play">▶ SPIELEN</button><button class="action" id="settingsBtn">⚙ EINSTELLUNGEN</button><div class="small">🏆 Rekord: <span id="best">0</span> m · 🪙 Gesamt: <span id="totalCoins">0</span></div></div></section><section id="settings" class="panel hidden"><div class="sheet"><h2>⚙ Einstellungen</h2><div class="field"><label for="mode">Springmodus</label><select id="mode"><option value="auto">Automatisch (bei Landung)</option><option value="manual">Manuell (Sprungtaste)</option></select></div><div class="field"><label for="steering">Steuerung</label><select id="steering"><option value="touch">Touch-Tasten</option><option value="tilt">Handy neigen</option></select></div><div class="field"><label for="slip">Eisrutschen</label><select id="slip"><option value="normal">Normal</option><option value="easy">Weniger rutschig</option></select></div><button class="action" id="calibrate">📱 Neigung freigeben / kalibrieren</button><p class="small" id="sensorStatus">Neigung benötigt auf iOS eine Sensorfreigabe. Touch funktioniert immer.</p><button class="action primary" id="save">✓ SPEICHERN</button><button class="action" id="back">← ZURÜCK</button></div></section><section id="paused" class="panel hidden"><div class="sheet"><h2>❄ Pausiert</h2><button class="action primary" id="resume">▶ WEITER</button><button class="action" id="pauseSettings">⚙ EINSTELLUNGEN</button><button class="action" id="toMenu">⌂ HAUPTMENÜ</button></div></section><section id="over" class="panel hidden"><div class="sheet"><h2>❄ Frosty ist gefallen!</h2><h1><span id="finalScore">0</span> m</h1><p>🪙 Münzen: <span id="finalCoins">0</span></p><button class="action primary" id="retry">↻ NOCHMAL SPIELEN</button><button class="action" id="overMenu">⌂ HAUPTMENÜ</button></div></section></div><script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');if(!ctx)return;const $=id=>document.getElementById(id);let W=0,H=0,DPR=1,game='menu',prev=0,cam=0,highest=0,runCoins=0,platforms=[],tokens=[],particles=[],stars=[],snow=[],keys={left:false,right:false},tilt=0,tiltBase=0,tiltReady=false,settingReturn='menu';const storage={get(k,d){try{return localStorage.getItem(k)??d}catch{return d}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};let best=Number(storage.get('frosty3d_best',0)),totalCoins=Number(storage.get('frosty3d_coins',0));$('best').textContent=best;$('totalCoins').textContent=totalCoins;$('mode').value=storage.get('frosty3d_mode','auto');$('steering').value=storage.get('frosty3d_steering','touch');$('slip').value=storage.get('frosty3d_slip','normal');let player={x:0,y:0,vx:0,vy:0,w:37,h:54,grounded:false,face:'front'};const front=new Image(),back=new Image();front.src='assets/front.png';back.src='assets/back.png';function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);stars=Array.from({length:65},()=>({x:Math.random()*W,y:Math.random()*H,r:.4+Math.random()*1.6}));snow=Array.from({length:65},()=>({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*2.4,v:10+Math.random()*30}));}addEventListener('resize',resize);resize();const rnd=(a,b)=>a+Math.random()*(b-a);const show=id=>['menu','settings','paused','over'].forEach(n=>$(n).classList.toggle('hidden',n!==id));function syncControls(){const active=game==='playing';$('controls').classList.toggle('hidden',!active);$('left').style.visibility=$('right').style.visibility=$('steering').value==='touch'?'visible':'hidden';$('jump').style.visibility=$('mode').value==='manual'?'visible':'hidden'}function setGame(v){game=v;show(v==='playing'?'none':v);if(v==='playing')show('none');keys.left=keys.right=false;syncControls()}function generate(){let top=Math.min(...platforms.map(p=>p.y));while(top>cam-200){let last=platforms.reduce((a,b)=>a.y<b.y?a:b);let dy=rnd(91,135),width=rnd(82,126),x=Math.max(8,Math.min(W-width-8,last.x+rnd(-125,125)));top=last.y-dy;let boost=Math.random()<.15,fragile=Math.random()<.14;let p={x,y:top,w:width,boost,fragile,used:false};platforms.push(p);if(Math.random()<.72)tokens.push({x:x+width/2,y:top-43,got:false,phase:rnd(0,6)});}}function start(){platforms=[];tokens=[];particles=[];runCoins=0;highest=0;cam=0;let x=W/2-64;platforms.push({x,y:H-112,w:128,boost:false,fragile:false,used:false});player={x:W/2-19,y:H-112-54,vx:0,vy:0,w:38,h:54,grounded:true,face:'front'};for(let i=1;i<10;i++){let y=H-112-i*112;x=Math.max(8,Math.min(W-108,x+rnd(-105,105)));let p={x,y,w:108,boost:i===3,fragile:false,used:false};platforms.push(p);if(i%2===0)tokens.push({x:x+54,y:y-44,got:false,phase:0});}cam=0;setGame('playing');$('score').textContent='0';$('coins').textContent='0'}function jump(force=false){if(game!=='playing')return;if(player.grounded||force){player.vy=force?-850:-650;player.grounded=false;player.face='back';burst(player.x+19,player.y+54,12);}}function burst(x,y,n){for(let i=0;i<n;i++)particles.push({x,y,vx:rnd(-115,115),vy:rnd(-130,30),life:rnd(.25,.65)})}function update(dt){if(game!=='playing')return;let steer=Number(keys.right)-Number(keys.left);if($('steering').value==='tilt'&&tiltReady)steer=Math.abs(tilt-tiltBase)<5?0:Math.max(-1,Math.min(1,(tilt-tiltBase)/22));const accel=1450,drag=$('slip').value==='easy'?7.5:4.5;player.vx+=steer*accel*dt;player.vx*=Math.exp(-drag*dt);player.vx=Math.max(-250,Math.min(250,player.vx));let oldBottom=player.y+player.h;player.x+=player.vx*dt;if(player.x>W+10)player.x=-player.w;if(player.x+player.w< -10)player.x=W+5;player.vy+=1480*dt;player.y+=player.vy*dt;player.grounded=false;for(const p of platforms){if(p.used)continue;if(player.vy>=0&&oldBottom<=p.y+11&&player.y+player.h>=p.y&&player.x+player.w-7>p.x&&player.x+7<p.x+p.w){player.y=p.y-player.h;player.vy=0;player.grounded=true;player.face='front';burst(player.x+19,p.y,8);if(p.fragile)p.used=true;if(p.boost){player.vy=-950;player.grounded=false;player.face='back';burst(player.x+19,p.y,25)}else if($('mode').value==='auto')jump();break;}}let screenY=player.y-cam;if(screenY<H*.43)cam=player.y-H*.43;highest=Math.max(highest,Math.floor((H-112-player.y)/10));$('score').textContent=highest;for(const t of tokens){if(!t.got&&Math.abs(t.x-(player.x+19))<28&&Math.abs(t.y-(player.y+27))<40){t.got=true;runCoins++;$('coins').textContent=runCoins;burst(t.x,t.y,12)}}platforms=platforms.filter(p=>p.y<cam+H+180);tokens=tokens.filter(t=>t.y<cam+H+180&&!t.got);generate();for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=350*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);if(player.y-cam>H+90){best=Math.max(best,highest);totalCoins+=runCoins;storage.set('frosty3d_best',best);storage.set('frosty3d_coins',totalCoins);$('best').textContent=best;$('totalCoins').textContent=totalCoins;$('finalScore').textContent=highest;$('finalCoins').textContent=runCoins;setGame('over')}}function poly(points,fill){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill()}function background(time){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#06122f');g.addColorStop(.55,'#12356a');g.addColorStop(1,'#0b254b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalAlpha=.35;for(let i=0;i<4;i++){ctx.save();ctx.translate(W*(.15+i*.23),H*.17);ctx.rotate(-.22+i*.11);let a=ctx.createLinearGradient(0,-H*.3,0,H*.45);a.addColorStop(0,'#21ffb300');a.addColorStop(.5,i%2?'#18e2db66':'#8d6bff66');a.addColorStop(1,'#3fe8b500');ctx.fillStyle=a;ctx.fillRect(-W*.12,-H*.4,W*.22,H*.7);ctx.restore()}ctx.globalAlpha=1;for(const s of stars){ctx.fillStyle='#d6f5ff';ctx.globalAlpha=.45+.45*Math.sin(time*.7+s.x);ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()}ctx.globalAlpha=1;const par=(cam*.06)%H;for(let layer=0;layer<2;layer++){let base=H*.82+par*.14+layer*55;let pts=[[0,H],[0,base]];for(let x=0;x<=W+60;x+=55)pts.push([x,base-rndDet(x,layer)*90]);pts.push([W,H]);poly(pts,layer?'#112e56':'#244c79');}for(const f of snow){f.y=(f.y+f.v*.014)%H;ctx.fillStyle='#e8fbffb0';ctx.beginPath();ctx.arc(f.x+Math.sin(time+f.y*.02)*6,f.y,f.r,0,7);ctx.fill()}}function rndDet(x,l){return(.5+.5*Math.sin(x*.035+l*3.7))}function platform(p,time){let x=p.x,y=p.y-cam,w=p.w;if(y< -110||y>H+100)return;let depth=16;ctx.shadowColor=p.boost?'#33eeff':'#58c9ff';ctx.shadowBlur=p.boost?25:10;poly([[x,y+4],[x+w,y+4],[x+w-7,y+depth],[x+7,y+depth]],'#127aa8');ctx.shadowBlur=0;let icicles=5;for(let i=0;i<icicles;i++){let ix=x+10+i*(w-20)/(icicles-1);poly([[ix-8,y+depth-1],[ix+8,y+depth-1],[ix+1,y+depth+12+(i%3)*9]],'#8ee9ffbb')}let g=ctx.createLinearGradient(x,y,x,y+14);g.addColorStop(0,'#c5fcff');g.addColorStop(.45,'#42c6f5');g.addColorStop(1,'#076dba');ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x,y,w,13,5);ctx.fill();ctx.strokeStyle='#e5ffff';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#b6faff55';ctx.fillRect(x+9,y+3,w-18,2);if(p.fragile){ctx.strokeStyle='#073f78';ctx.beginPath();ctx.moveTo(x+w*.4,y);ctx.lineTo(x+w*.53,y+7);ctx.lineTo(x+w*.48,y+12);ctx.stroke()}if(p.boost){ctx.shadowColor='#00ffff';ctx.shadowBlur=14;ctx.fillStyle='#c9ffff';ctx.font='bold 24px system-ui';ctx.textAlign='center';ctx.fillText('⇧',x+w/2,y+8);ctx.shadowBlur=0}}function drawPlayer(time){let x=player.x,y=player.y-cam;ctx.save();ctx.translate(x+player.w/2,y+player.h/2);if(player.vy<0)ctx.rotate(Math.max(-.13,Math.min(.13,player.vx/1500)));let img=player.face==='back'?back:front;if(img.complete&&img.naturalWidth){ctx.shadowColor='#44dfff';ctx.shadowBlur=14;ctx.drawImage(img,-31,-42,62,84);ctx.shadowBlur=0}else{ctx.fillStyle='#a6eaff';ctx.beginPath();ctx.ellipse(0,0,21,27,0,0,7);ctx.fill();ctx.fillStyle='#062044';ctx.beginPath();ctx.arc(0,-8,16,0,7);ctx.fill();ctx.fillStyle='#70f4ff';ctx.fillRect(-9,-12,6,9);ctx.fillRect(4,-12,6,9)}ctx.restore()}function draw(time){background(time);for(const p of platforms)platform(p,time);for(const t of tokens){let y=t.y-cam;if(y< -30||y>H+30)continue;ctx.save();ctx.translate(t.x,y+Math.sin(time*3+t.phase)*4);ctx.shadowColor='#ffd44c';ctx.shadowBlur=16;ctx.fillStyle='#ffc943';ctx.beginPath();ctx.ellipse(0,0,10*(.7+.3*Math.abs(Math.cos(time*2+t.phase))),12,0,0,7);ctx.fill();ctx.strokeStyle='#fff3aa';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#a96700';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillText('❄',0,5);ctx.restore()}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle='#b5ffff';ctx.beginPath();ctx.arc(p.x,p.y-cam,2.7,0,7);ctx.fill()}ctx.globalAlpha=1;drawPlayer(time)}let time=0;function frame(ts){let dt=Math.min(.032,(ts-prev)/1000||.016);prev=ts;time+=dt;update(dt);draw(time);requestAnimationFrame(frame)}requestAnimationFrame(frame);function menu(){setGame('menu')}function settings(from){settingReturn=from;setGame('settings')}function save(){for(const [k,v] of [['mode',$('mode').value],['steering',$('steering').value],['slip',$('slip').value]])storage.set('frosty3d_'+k,v);setGame(settingReturn==='paused'?'paused':'menu')} $('play').onclick=start;$('retry').onclick=start;$('settingsBtn').onclick=()=>settings('menu');$('pauseSettings').onclick=()=>settings('paused');$('save').onclick=save;$('back').onclick=()=>setGame(settingReturn==='paused'?'paused':'menu');$('pauseBtn').onclick=()=>{if(game==='playing')setGame('paused')};$('resume').onclick=()=>setGame('playing');$('toMenu').onclick=menu;$('overMenu').onclick=menu;$('jump').onclick=e=>{e.preventDefault();jump()};for(const dir of ['left','right']){let el=$(dir);const down=e=>{e.preventDefault();keys[dir]=true;try{el.setPointerCapture(e.pointerId)}catch{}};const up=e=>{e.preventDefault();keys[dir]=false};el.addEventListener('pointerdown',down);['pointerup','pointercancel','lostpointercapture','pointerleave'].forEach(ev=>el.addEventListener(ev,up))}addEventListener('blur',()=>{keys.left=keys.right=false;if(game==='playing')setGame('paused')});document.addEventListener('visibilitychange',()=>{if(document.hidden){keys.left=keys.right=false;if(game==='playing')setGame('paused')}});addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(e.key===' '||e.key==='ArrowUp'){e.preventDefault();jump()}if(e.key==='Escape'&&game==='playing')setGame('paused')});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false});function orientation(e){if(typeof e.gamma==='number'){tilt=e.gamma;tiltReady=true}}addEventListener('deviceorientation',orientation);$('calibrate').onclick=async()=>{try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){let result=await DeviceOrientationEvent.requestPermission();if(result!=='granted')throw Error('Sensorzugriff abgelehnt')}tiltBase=tilt;$('sensorStatus').textContent='✓ Neigung aktiviert. Halte das Handy gerade und tippe erneut zum Kalibrieren.'}catch(e){$('sensorStatus').textContent='Neigung nicht verfügbar. Bitte Touch-Steuerung verwenden.'}};show('menu');syncControls();})();
</script></body></html>
